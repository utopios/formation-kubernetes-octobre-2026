# TrackR — brique API (podinfo en mode backend, cache Redis).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trackr-api
  labels:
    app: trackr-api
    app.kubernetes.io/part-of: trackr
  annotations:
    kubernetes.io/change-cause: "TrackR API 6.9.2 initiale"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: trackr-api
  template:
    metadata:
      labels:
        app: trackr-api
        app.kubernetes.io/part-of: trackr
    spec:
      containers:
        - name: api
          image: ghcr.io/stefanprodan/podinfo:6.9.2
          command:
            - ./podinfo
            - --port=9898
            - --level=info
            - --cache-server=tcp://trackr-cache:6379
          ports:
            - name: http
              containerPort: 9898
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:              # laisse le temps aux EndpointSlices d'oublier le Pod
              exec:
                command: ["sleep", "5"]
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: trackr-api
  labels:
    app: trackr-api
    app.kubernetes.io/part-of: trackr
spec:
  type: ClusterIP
  selector:
    app: trackr-api
  ports:
    - name: http
      port: 9898
      targetPort: http
