# TrackR — brique cache (Redis). Module 5 : Deployment + Service ClusterIP.
# Application : kubectl apply -n trackr -f code/manifests/module-05/trackr/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trackr-cache
  labels:
    app: trackr-cache
    app.kubernetes.io/part-of: trackr
spec:
  replicas: 1
  strategy:
    type: Recreate            # un seul Redis à la fois (pas de double écriture)
  selector:
    matchLabels:
      app: trackr-cache
  template:
    metadata:
      labels:
        app: trackr-cache
        app.kubernetes.io/part-of: trackr
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: trackr-cache
  labels:
    app: trackr-cache
    app.kubernetes.io/part-of: trackr
spec:
  type: ClusterIP
  selector:
    app: trackr-cache
  ports:
    - name: redis
      port: 6379
      targetPort: redis
