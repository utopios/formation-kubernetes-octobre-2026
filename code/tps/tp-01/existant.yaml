# TP 1 - Etat de depart du namespace (fourni, ne pas modifier)
# - l'API TrackR deja deployee en recette par l'equipe API ;
# - une ancienne maquette du front, laissee en place par l'equipe web.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trackr-api
  labels:
    app: trackr
    tier: api
    env: recette
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trackr
      tier: api
      env: recette
  template:
    metadata:
      labels:
        app: trackr
        tier: api
        env: recette
    spec:
      containers:
        - name: api
          image: ghcr.io/stefanprodan/podinfo:6.9.2
          ports:
            - containerPort: 9898
---
apiVersion: v1
kind: Service
metadata:
  name: trackr-api
  labels:
    app: trackr
    tier: api
    env: recette
spec:
  selector:
    app: trackr
    tier: api
    env: recette
  ports:
    - port: 9898
      targetPort: 9898
---
apiVersion: v1
kind: Pod
metadata:
  name: trackr-front-maquette
  labels:
    app: trackr
    tier: front
    env: maquette
spec:
  containers:
    - name: front
      image: ghcr.io/stefanprodan/podinfo:6.9.2
      args: ["./podinfo", "--port=9898", "--ui-message=MAQUETTE - ne pas utiliser"]
      ports:
        - containerPort: 9898
