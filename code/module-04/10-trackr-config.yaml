# Module 4 — Configuration applicative de TrackR : ConfigMap + Secret
# kubectl apply -n trackr -f 10-trackr-config.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trackr-config
  labels:
    app.kubernetes.io/part-of: trackr
data:
  # cles consommees en variables d'environnement (envFrom)
  PODINFO_UI_MESSAGE: "TrackR - suivi des colis Logivia"
  PODINFO_UI_COLOR: "#438ecc"
  PODINFO_LEVEL: "info"
---
# ConfigMap separee pour les fichiers : sinon envFrom importerait aussi « trackr.properties »
# comme variable d'environnement (nom accepte depuis Kubernetes 1.34, constate sur le lab)
apiVersion: v1
kind: ConfigMap
metadata:
  name: trackr-fichiers
  labels:
    app.kubernetes.io/part-of: trackr
data:
  # consommee en volume : /etc/trackr/config/trackr.properties
  trackr.properties: |
    zone=europe-ouest
    retention.jours=30
    alertes.retard.heures=48
---
apiVersion: v1
kind: Secret
metadata:
  name: trackr-api-secrets
  labels:
    app.kubernetes.io/part-of: trackr
type: Opaque
# stringData : saisie en clair, l'API server stocke la valeur encodee en base64 dans data
stringData:
  API_TOKEN: "lgv-demo-7f3a9c2e"
  partenaire.json: |
    {"transporteur": "colis-express", "cle": "ce-demo-41b8"}
