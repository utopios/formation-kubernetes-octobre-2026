# TP 2 — État de TrackR tel que livré la veille de la nuit d'astreinte.
# Appliqué par scenario.sh : ne pas l'appliquer seul.
# Namespace : celui de la commande (trackr par défaut).
apiVersion: v1
kind: LimitRange
metadata:
  name: trackr-limites
  labels:
    app.kubernetes.io/part-of: trackr
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 200m
        memory: 128Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trackr-api-config
  labels:
    app.kubernetes.io/part-of: trackr
data:
  LOG_LEVEL: info
  TRACKR_REGION: eu-west
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trackr-api
  labels:
    app.kubernetes.io/name: trackr-api
    app.kubernetes.io/part-of: trackr
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: trackr-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trackr-api
        app.kubernetes.io/part-of: trackr
    spec:
      containers:
        - name: api
          image: ghcr.io/stefanprodan/podinfo:6.9.2
          envFrom:
            - configMapRef:
                name: trackr-api-config
          ports:
            - containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9898
---
apiVersion: v1
kind: Service
metadata:
  name: trackr-api
  labels:
    app.kubernetes.io/name: trackr-api
    app.kubernetes.io/part-of: trackr
spec:
  selector:
    app.kubernetes.io/name: trackr-api
  ports:
    - name: http
      port: 80
      targetPort: 9898
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trackr-cache
  labels:
    app.kubernetes.io/name: trackr-cache
    app.kubernetes.io/part-of: trackr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trackr-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trackr-cache
        app.kubernetes.io/part-of: trackr
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          ports:
            - containerPort: 6379
---
# Lot d'export nocturne des colis livrés.
# Besoin mesuré par l'équipe : 480 Mi de mémoire.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trackr-export
  labels:
    app.kubernetes.io/name: trackr-export
    app.kubernetes.io/part-of: trackr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trackr-export
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trackr-export
        app.kubernetes.io/part-of: trackr
    spec:
      containers:
        - name: export
          image: busybox:1.37
          command: ["sh", "-c", "while true; do echo export-colis-livres; sleep 60; done"]
          resources:
            requests:
              cpu: 20m
              memory: 480Gi
            limits:
              memory: 480Gi
