# Cluster de lab de la formation : 1 control-plane + 2 workers, Kubernetes v1.35
# Le port 30080 du control-plane est publie sur la machine hote (Services NodePort).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k8s-formation
nodes:
  - role: control-plane
    image: kindest/node:v1.35.0
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
  - role: worker
    image: kindest/node:v1.35.0
  - role: worker
    image: kindest/node:v1.35.0
