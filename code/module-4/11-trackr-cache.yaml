# Module 4 — trackr-cache (Redis) avec stockage persistant
# PVC sur la StorageClass « standard » (local-path, provisionnement dynamique)
# kubectl apply -n trackr -f 11-trackr-cache.yaml
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trackr-cache-data
  labels:
    app.kubernetes.io/name: trackr-cache
    app.kubernetes.io/part-of: trackr
spec:
  storageClassName: standard
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trackr-cache
  labels:
    app.kubernetes.io/name: trackr-cache
    app.kubernetes.io/part-of: trackr
spec:
  replicas: 1
  strategy:
    type: Recreate          # un seul pod a la fois sur un volume ReadWriteOnce
  selector:
    matchLabels:
      app.kubernetes.io/name: trackr-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trackr-cache
        app.kubernetes.io/part-of: trackr
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "250m", memory: "128Mi" }
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: trackr-cache-data
---
apiVersion: v1
kind: Service
metadata:
  name: trackr-cache
  labels:
    app.kubernetes.io/name: trackr-cache
    app.kubernetes.io/part-of: trackr
spec:
  selector:
    app.kubernetes.io/name: trackr-cache
  ports:
    - name: redis
      port: 6379
      targetPort: redis
