# Test de fumée du TP 3 : 2 réplicas podinfo, un Service, un Job client qui passe par le DNS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-web
  labels: {role: smoke-test}
spec:
  replicas: 2
  selector:
    matchLabels: {app: smoke-web}
  template:
    metadata:
      labels: {app: smoke-web, role: smoke-test}
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.9.2
          ports: [{containerPort: 9898}]
          readinessProbe:
            httpGet: {path: /readyz, port: 9898}
---
apiVersion: v1
kind: Service
metadata:
  name: smoke-web
  labels: {role: smoke-test}
spec:
  selector: {app: smoke-web}
  ports: [{port: 9898, targetPort: 9898}]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: smoke-client
  labels: {role: smoke-test}
spec:
  backoffLimit: 2
  template:
    metadata:
      labels: {role: smoke-test}
    spec:
      restartPolicy: Never
      containers:
        - name: client
          image: busybox:1.37
          command: ["sh", "-c"]
          args:
            - |
              set -e
              CIBLE=smoke-web.trackr.svc.cluster.local
              nslookup "$CIBLE"
              for i in 1 2 3 4 5 6; do
                wget -qO- "http://$CIBLE:9898/api/info" | grep '"hostname"'
              done
              echo "TEST DE FUMEE OK"
